<svg width="1000" height="1400" viewBox="0 0 1000 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="1400" fill="#0B1220" />

  <!-- faint grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="600" x2="1000" y2="600" />
    <line x1="0" y1="800" x2="1000" y2="800" />
    <line x1="0" y1="1000" x2="1000" y2="1000" />
    <line x1="0" y1="1200" x2="1000" y2="1200" />
  </g>

  <!-- candlestick chart, general uptrend -->
  <g>
    <!-- wicks -->
    <g stroke="#3B82F6" stroke-width="4" opacity="0.55">
      <line x1="90"  y1="980"  x2="90"  y2="1120" />
      <line x1="170" y1="900"  x2="170" y2="1060" />
      <line x1="250" y1="960"  x2="250" y2="1080" />
      <line x1="330" y1="820"  x2="330" y2="1000" />
      <line x1="410" y1="760"  x2="410" y2="920" />
      <line x1="490" y1="700"  x2="490" y2="880" />
      <line x1="570" y1="620"  x2="570" y2="800" />
      <line x1="650" y1="560"  x2="650" y2="740" />
      <line x1="730" y1="460"  x2="730" y2="660" />
      <line x1="810" y1="380"  x2="810" y2="580" />
      <line x1="890" y1="300"  x2="890" y2="500" />
    </g>
    <!-- bodies -->
    <g>
      <rect x="70"  y="1010" width="40" height="80"  fill="#FF7700" opacity="0.5" />
      <rect x="150" y="930"  width="40" height="90"  fill="#3B82F6" opacity="0.6" />
      <rect x="230" y="990"  width="40" height="60"  fill="#FF7700" opacity="0.5" />
      <rect x="310" y="850"  width="40" height="110" fill="#3B82F6" opacity="0.6" />
      <rect x="390" y="790"  width="40" height="100" fill="#3B82F6" opacity="0.6" />
      <rect x="470" y="730"  width="40" height="110" fill="#FF7700" opacity="0.5" />
      <rect x="550" y="650"  width="40" height="120" fill="#3B82F6" opacity="0.6" />
      <rect x="630" y="590"  width="40" height="120" fill="#3B82F6" opacity="0.6" />
      <rect x="710" y="490"  width="40" height="140" fill="#3B82F6" opacity="0.65" />
      <rect x="790" y="410"  width="40" height="140" fill="#FF7700" opacity="0.55" />
      <rect x="870" y="330"  width="40" height="140" fill="#3B82F6" opacity="0.65" />
    </g>
  </g>

  <!-- rising trend line with glow -->
  <polyline
    points="60,1150 220,1040 380,930 540,760 700,600 860,380 940,260"
    fill="none"
    stroke="#FF7700"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.7"
  />

  <!-- large soft accent glows -->
  <circle cx="820" cy="320" r="260" fill="#FF7700" opacity="0.08" />
  <circle cx="140" cy="1100" r="220" fill="#3B82F6" opacity="0.08" />
</svg>
